# Dependabot — renovación revisada de dependencias (M-tech-stack §11, V-risk R-014)
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/services/gateway"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/identity"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/audit"
    schedule:
      interval: weekly
