name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar uv
        run: pip install uv
      - name: Sincronizar dependencias
        run: uv sync --frozen --all-packages
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy packages services

  test:
    name: Suite de pruebas
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_local_dev_only
          POSTGRES_DB: platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar uv
        run: pip install uv
      - name: Sincronizar dependencias
        run: uv sync --frozen --all-packages
      - name: Crear bases por servicio
        env:
          PGPASSWORD: platform_local_dev_only
        run: |
          psql -h 127.0.0.1 -p 5433 -U platform -d platform -c "CREATE DATABASE platform_identity;" || true
          psql -h 127.0.0.1 -p 5433 -U platform -d platform -c "CREATE DATABASE platform_audit;" || true
      - name: pytest (unit + integration + e2e)
        run: uv run pytest
