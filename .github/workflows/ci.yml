# CI — gates de Fase 1 (ADR-0001, G-security §1.7, W-build-now BUILD-001..005, REQ-072/121)
# Todas las actions van pinnadas por SHA (supply chain); comentarios indican la tag.
name: CI

on:
  push:
    branches: [master, main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y gates estáticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.4"
          python-version: "3.14"
      - name: Sincronizar dependencias
        run: uv sync --frozen --all-packages
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy packages services
      - name: Lint de fronteras del monorepo (BUILD-001)
        run: uv run python tools/check_boundaries.py
      - name: Lint anti-float en paths de dinero (BUILD-024, ADR-0006)
        run: uv run python tools/check_no_float.py
      - name: OpenAPI canónico sin deriva (BUILD-016)
        run: uv run python tools/export_openapi.py --check

  test:
    name: Pruebas (unit + integration + e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_local_dev_only
          POSTGRES_DB: platform
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDPANDA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.4"
          python-version: "3.14"
      - name: Sincronizar dependencias
        run: uv sync --frozen --all-packages
      - name: Crear bases por servicio
        run: |
          export PGPASSWORD=platform_local_dev_only
          for db in platform_identity platform_audit platform_gateway platform_ledger platform_accounts platform_wallet platform_market_data; do
            psql -h localhost -p 5433 -U platform -d platform -c "CREATE DATABASE ${db};"
          done
      - name: Levantar Redpanda
        run: |
          for attempt in 1 2 3; do
            docker rm -f redpanda 2>/dev/null || true
            if docker run -d --name redpanda -p 19092:19092 \
              docker.redpanda.com/redpandadata/redpanda:v24.3.4 \
              redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
              --node-id 0 --check=false \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://127.0.0.1:9092,external://127.0.0.1:19092 \
              2>/tmp/rp-run.log; then
              break
            fi
            echo "::warning::docker run de Redpanda (intento ${attempt}) falló: $(tr '\n' ' ' </tmp/rp-run.log)"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::docker run de Redpanda falló 3 veces: $(tr '\n' ' ' </tmp/rp-run.log)"
              exit 1
            fi
          done
          healthy=0
          for ((i=1; i<=60; i++)); do
            out=$(docker exec redpanda rpk cluster health 2>/dev/null || true)
            if [[ "${out}" == *Healthy:*true* ]] && \
              docker exec redpanda rpk cluster info --brokers 127.0.0.1:19092 >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "${healthy}" != "1" ]; then
            echo "::error::Redpanda no quedó saludable en 180s. Estado: $(docker ps -a --filter name=redpanda --format '{{.Status}}'). Logs: $(docker logs redpanda 2>&1 | tail -n 25 | tr '\n' '|')"
            exit 1
          fi
          docker exec redpanda rpk cluster health
          docker exec redpanda rpk cluster info --brokers 127.0.0.1:19092
      - name: pytest (unit + integration + e2e) con cobertura
        run: uv run pytest --cov --cov-report=json --cov-report=term
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-json
          path: coverage.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Gates de cobertura (BUILD-024)
        run: uv run python tools/check_coverage.py

  security:
    name: Secret-scan y vulnerabilidades de dependencias (BUILD-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo para gitleaks
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.4"
          python-version: "3.14"
      - name: gitleaks (secretos en el historial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
      - name: pip-audit (dependencias Python)
        run: |
          uv export --frozen --no-emit-workspace --format requirements-txt --output-file /tmp/reqs-audit.txt
          uvx pip-audit -r /tmp/reqs-audit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: npm audit (bloquea en CRITICAL; HIGH queda tracked en docs/component-status.md)
        run: npm ci --no-audit && npm audit --audit-level=critical

  supply-chain:
    name: Imágenes, SBOM y CVE (BUILD-003/005, REQ-121)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imágenes
        run: |
          for svc in gateway identity audit market-data ledger accounts wallet; do
            docker build -f "services/${svc}/Dockerfile" -t "platform/${svc}:ci" .
          done
      - name: SBOM por imagen (syft)
        run: |
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
          mkdir -p sbom
          for svc in gateway identity audit market-data ledger accounts wallet; do
            syft "platform/${svc}:ci" -o "spdx-json=sbom/${svc}.spdx.json" --quiet
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 30
      - name: Escaneo de imágenes (trivy; CRITICAL bloquea)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            | tar -xz -C /usr/local/bin trivy
          for svc in gateway identity audit market-data ledger accounts wallet; do
            trivy image --severity CRITICAL --exit-code 1 --scanners vuln "platform/${svc}:ci"
          done

  infra:
    name: Terraform, K8s y compose (BUILD-004)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - name: terraform init + validate (estructura)
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
      - name: kustomize build (base + overlay dev)
        run: |
          kubectl kustomize infrastructure/kubernetes/base > /dev/null
          kubectl kustomize infrastructure/kubernetes/overlays/dev > /dev/null
      - name: docker compose config (perfiles events + obs)
        run: docker compose -f infrastructure/compose/compose.yml --profile obs --profile events config --quiet

  web:
    name: Frontend lint, typecheck y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint --workspace apps/web
      - name: TypeScript
        run: npm run typecheck --workspace apps/web
      - name: Build de producción
        run: npm run build --workspace apps/web
