# Despliegue de la plataforma en servidor Docker (OMV) — puertos 40000-40100.
# Uso:
#   1) cp .env.example .env  -> completar secretos (openssl rand -hex 32)
#   2) docker compose build
#   3) docker compose up -d                 (núcleo: app + datos)
#      docker compose --profile obs up -d   (añade observabilidad)
# Perfil obs: prometheus(40020) grafana(40021) loki(40022) tempo(40023) otel-collector(40024).
# Nota de seguridad: los puertos de datos (40010-40012) y de obs internos se publican
# SOLO en 127.0.0.1 del servidor; la app (40000-40005) y Grafana (40021) son de LAN.

name: platform-omv

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "127.0.0.1:40010:5432"
    volumes:
      - ../infrastructure/compose/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:40011:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:40012
    ports:
      - "127.0.0.1:40012:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  identity:
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    image: platform/identity:omv
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        python -c "import os; from identity.migrate import run_migrations; run_migrations(os.environ['DATABASE_URL'])"
        exec uvicorn identity.main:app --host 0.0.0.0 --port 8081
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/platform_identity
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      REQUIRE_EMAIL_VERIFICATION: "false"
      TRUST_PROXY_HEADERS: "true"
      FLAG_MFA: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OUTBOX_RELAY_ENABLED: "true"
    ports:
      - "40002:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  audit:
    build:
      context: ..
      dockerfile: services/audit/Dockerfile
    image: platform/audit:omv
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        python -c "import os; from audit.migrate import run_migrations; run_migrations(os.environ['AUDIT_DATABASE_URL'])"
        exec uvicorn audit.main:app --host 0.0.0.0 --port 8083
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      AUDIT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/platform_audit
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      EVENT_CONSUMER_ENABLED: "true"
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    ports:
      - "40003:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  market-data:
    build:
      context: ..
      dockerfile: services/market-data/Dockerfile
    image: platform/market-data:omv
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    ports:
      - "40004:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    image: platform/gateway:omv
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      IDENTITY_URL: http://identity:8081
      AUDIT_URL: http://audit:8083
      MARKET_DATA_URL: http://market-data:8084
      LEDGER_URL: http://ledger:8085
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    ports:
      - "40001:8080"
    depends_on:
      identity:
        condition: service_healthy
      audit:
        condition: service_healthy
      market-data:
        condition: service_healthy
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: platform/web:omv
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "40000:3000"
    depends_on:
      gateway:
        condition: service_healthy

  ledger:
    build:
      context: ..
      dockerfile: services/ledger/Dockerfile
    image: platform/ledger:omv
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        python -c "import os; from ledger.migrate import run_migrations; run_migrations(os.environ['LEDGER_DATABASE_URL'])"
        exec uvicorn ledger.main:app --host 0.0.0.0 --port 8085
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      LEDGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/platform_ledger
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OUTBOX_RELAY_ENABLED: "true"
    ports:
      - "40005:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------- perfil obs (opcional) ----------
  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.118.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:40024:4318"

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:40020:9090"
    depends_on:
      - otel-collector

  loki:
    profiles: ["obs"]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../infrastructure/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:40022:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../infrastructure/monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:40023:3200"

  alloy:
    profiles: ["obs"]
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ../infrastructure/monitoring/alloy-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    ports:
      - "40021:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ../infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  redisdata:
  promdata:
  lokidata:
  tempodata:
  alloydata:
  grafanadata:
