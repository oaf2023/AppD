# Prometheus (despliegue OMV) — scrapea los servicios dentro de la red compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
        labels:
          platform: omv

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          platform: omv
