components:
  schemas:
    BalanceListOut:
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        data:
          items:
            $ref: '#/components/schemas/BalanceOut'
          title: Data
          type: array
        reconciliation:
          $ref: '#/components/schemas/ReconciliationOut'
      required:
      - data
      - as_of
      - reconciliation
      title: BalanceListOut
      type: object
    BalanceOut:
      properties:
        available:
          title: Available
          type: string
        currency:
          title: Currency
          type: string
        reconciled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Reconciled At
        reserved:
          title: Reserved
          type: string
        stale:
          default: false
          title: Stale
          type: boolean
      required:
      - currency
      - available
      - reserved
      title: BalanceOut
      type: object
    ConversionRateOut:
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        base:
          title: Base
          type: string
        quote:
          title: Quote
          type: string
        rate:
          title: Rate
          type: string
        source:
          title: Source
          type: string
      required:
      - base
      - quote
      - rate
      - source
      - as_of
      title: ConversionRateOut
      type: object
    ConversionRatesOut:
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: As Of
        data:
          items:
            $ref: '#/components/schemas/ConversionRateOut'
          title: Data
          type: array
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      required:
      - data
      title: ConversionRatesOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthOut:
      properties:
        service:
          title: Service
          type: string
        status:
          title: Status
          type: string
      required:
      - service
      - status
      title: HealthOut
      type: object
    MovementOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        currency:
          title: Currency
          type: string
        delta:
          title: Delta
          type: string
        direction:
          enum:
          - D
          - C
          title: Direction
          type: string
        ledger_transaction_id:
          format: uuid
          title: Ledger Transaction Id
          type: string
        movement_id:
          format: uuid
          title: Movement Id
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        tx_type:
          title: Tx Type
          type: string
      required:
      - movement_id
      - currency
      - delta
      - direction
      - tx_type
      - ledger_transaction_id
      - occurred_at
      - created_at
      title: MovementOut
      type: object
    MovementPageOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/MovementOut'
          title: Data
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - data
      - page
      title: MovementPageOut
      type: object
    PageInfo:
      description: 'Q-api-map §1.4: cursor opaco, sin offset.'
      properties:
        has_more:
          default: false
          title: Has More
          type: boolean
        limit:
          default: 25
          title: Limit
          type: integer
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        prev_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev Cursor
      title: PageInfo
      type: object
    ReadyOut:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: ReadyOut
      type: object
    ReconciliationOut:
      description: Estado de la última comparación wallet↔ledger (BUILD-019).
      properties:
        checked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Checked At
        stale:
          title: Stale
          type: boolean
      required:
      - stale
      title: ReconciliationOut
      type: object
    TransferIn:
      additionalProperties: false
      properties:
        amount:
          description: Decimal canónico (punto decimal, sin separadores)
          minLength: 1
          title: Amount
          type: string
        currency:
          description: ISO 4217, debe coincidir con ambas cuentas
          pattern: ^[A-Z]{3}$
          title: Currency
          type: string
        from_account_id:
          format: uuid
          title: From Account Id
          type: string
        to_account_id:
          format: uuid
          title: To Account Id
          type: string
      required:
      - from_account_id
      - to_account_id
      - amount
      - currency
      title: TransferIn
      type: object
    TransferOut:
      properties:
        amount:
          title: Amount
          type: string
        currency:
          title: Currency
          type: string
        from_account_id:
          format: uuid
          title: From Account Id
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        status:
          const: posted
          default: posted
          title: Status
          type: string
        to_account_id:
          format: uuid
          title: To Account Id
          type: string
        transfer_id:
          format: uuid
          title: Transfer Id
          type: string
      required:
      - transfer_id
      - from_account_id
      - to_account_id
      - amount
      - currency
      - occurred_at
      title: TransferOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WalletBalanceOut:
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        available:
          title: Available
          type: string
        currency:
          title: Currency
          type: string
        reconciled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Reconciled At
        reserved:
          title: Reserved
          type: string
        stale:
          default: false
          title: Stale
          type: boolean
      required:
      - currency
      - available
      - reserved
      - as_of
      title: WalletBalanceOut
      type: object
info:
  title: MonedasAR Wallet Service
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/wallet/balances:
    get:
      description: 'Proyección local más `reconciliation` (BUILD-019): `stale=true`
        indica descuadre.'
      operationId: list_balances_api_v1_wallet_balances_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceListOut'
          description: Successful Response
      summary: Balances por moneda del usuario autenticado
      tags:
      - wallet
  /api/v1/wallet/balances/{currency}:
    get:
      operationId: get_balance_api_v1_wallet_balances__currency__get
      parameters:
      - in: path
        name: currency
        required: true
        schema:
          title: Currency
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Balance de una moneda
      tags:
      - wallet
  /api/v1/wallet/conversion-rates:
    get:
      description: 'Tabla vacía en F2: el motor FX está como NO DETERMINADO en L §10
        (sin tasas inventadas).'
      operationId: conversion_rates_api_v1_wallet_conversion_rates_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionRatesOut'
          description: Successful Response
      summary: Tabla de conversiones de divisas
      tags:
      - wallet
  /api/v1/wallet/transactions:
    get:
      description: Movimientos propios en `[from, to]` orden `(occurred_at, id)` desc
        (Q §2.5).
      operationId: list_transactions_api_v1_wallet_transactions_get
      parameters:
      - description: Inicio del rango (obligatorio, ≤ 90 días)
        in: query
        name: from
        required: true
        schema:
          description: Inicio del rango (obligatorio, ≤ 90 días)
          format: date-time
          title: From
          type: string
      - description: Fin del rango (obligatorio)
        in: query
        name: to
        required: true
        schema:
          description: Fin del rango (obligatorio)
          format: date-time
          title: To
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Movimientos de saldo por rango (cursor, §2.5)
      tags:
      - wallet
  /api/v1/wallet/transfers:
    post:
      description: 'Ejecuta un posting `transfer` síncrono en ledger (única vía de
        escritura, §3).


        `Idempotency-Key` obligatorio (UUID): el replay devuelve la misma respuesta

        con `Idempotent-Replay: true` (ADR-0010/0011).'
      operationId: create_transfer_api_v1_wallet_transfers_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Transferencia A→B entre cuentas propias (§2.5)
      tags:
      - wallet
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyOut'
          description: Successful Response
      summary: Readyz
      tags:
      - system
