[project]
name = "identity-service"
version = "0.1.0"
description = "Identity Service — usuarios, sesiones, MFA, RBAC"
requires-python = ">=3.13"
dependencies = [
    "platform-kernel",
    "platform-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "aiokafka>=0.14.0",
]

[project.scripts]
identity = "identity.main:run"

[tool.uv.sources]
platform-kernel = { workspace = true }
platform-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]
