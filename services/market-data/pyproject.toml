[project]
name = "market-data-service"
version = "0.1.0"
description = "Market Data — Forex y Crypto de referencia (proveedores keyless, cero secretos)"
requires-python = ">=3.14"
dependencies = [
    "platform-kernel",
    "platform-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
]

[project.scripts]
market-data = "market_data.main:run"

[tool.uv.sources]
platform-kernel = { workspace = true }
platform-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]
