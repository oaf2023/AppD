# OpenTelemetry Collector (perfil obs) — recibe OTLP y exporta métricas para Prometheus.
# Uso: docker compose -f infrastructure/compose/compose.yml --profile obs up -d
# Los servicios envían traces/metrics por OTLP/HTTP a :4318; Prometheus scrapea :8889.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    const_labels:
      platform: local
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
