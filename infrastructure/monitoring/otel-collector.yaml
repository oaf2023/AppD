# OpenTelemetry Collector (perfil obs) — recibe OTLP (métricas/traces/logs de los
# servicios, cuando el SDK OTel está activo) y exporta:
#   - métricas → Prometheus (:8889, scrapeado por prometheus.yaml)
#   - traces   → Tempo (otlp/grpc tempo:4317)
#   - logs     → Loki (otlp/http loki:3100/otlp) — pipeline en espera (dormant)
#                hasta que los servicios exporten logs OTel.
# Uso: docker compose -f infrastructure/compose/compose.yml --profile obs up -d

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    const_labels:
      platform: local
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
