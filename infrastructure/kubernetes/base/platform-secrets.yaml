# PLACEHOLDER — NO APLICAR en Fase 1 (ADR-0020: secretos en secret store, nunca en git).
# Los valores siguientes son marcadores obvios; el despliegue real los inyecta desde el
# secret store/externo secret del cluster.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
type: Opaque
stringData:
  JWT_SECRET: "REEMPLAZAR_EN_SECRET_STORE_min_32_caracteres"
  SERVICE_TOKEN_SECRET: "REEMPLAZAR_EN_SECRET_STORE_min_32_caracteres"
  DATABASE_URL: "postgresql+psycopg://REEMPLAZAR@identity-db:5432/platform_identity"
  AUDIT_DATABASE_URL: "postgresql+psycopg://REEMPLAZAR@audit-db:5432/platform_audit"
  LEDGER_DATABASE_URL: "postgresql+psycopg://REEMPLAZAR@ledger-db:5432/platform_ledger"
  ACCOUNTS_DATABASE_URL: "postgresql+psycopg://REEMPLAZAR@accounts-db:5432/platform_accounts"
