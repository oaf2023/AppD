components:
  schemas:
    CandleOut:
      properties:
        candle_id:
          format: uuid
          title: Candle Id
          type: string
        close:
          anyOf:
          - type: string
          - type: 'null'
          title: Close
        gap:
          default: false
          title: Gap
          type: boolean
        high:
          anyOf:
          - type: string
          - type: 'null'
          title: High
        low:
          anyOf:
          - type: string
          - type: 'null'
          title: Low
        open:
          anyOf:
          - type: string
          - type: 'null'
          title: Open
        simulated:
          title: Simulated
          type: boolean
        source:
          title: Source
          type: string
        symbol:
          title: Symbol
          type: string
        timeframe:
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
          - 4h
          - 1d
          title: Timeframe
          type: string
        ts:
          format: date-time
          title: Ts
          type: string
        volume:
          anyOf:
          - type: string
          - type: 'null'
          title: Volume
      required:
      - candle_id
      - symbol
      - timeframe
      - ts
      - source
      - simulated
      title: CandleOut
      type: object
    CandlePageOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CandleOut'
          title: Data
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - data
      - page
      title: CandlePageOut
      type: object
    FeedBriefOut:
      description: 'Estado del feed por símbolo (Q §2.7: `symbols` con estado del
        feed).'
      properties:
        last_tick_ts:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Tick Ts
        simulated:
          title: Simulated
          type: boolean
        source:
          title: Source
          type: string
      required:
      - source
      - simulated
      title: FeedBriefOut
      type: object
    FeedStatusOut:
      description: 'Estado del feed (Q §2.7): simulated/real, latencia y huecos detectados.'
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        candles_total:
          title: Candles Total
          type: integer
        gaps_total:
          title: Gaps Total
          type: integer
        ingest_enabled:
          title: Ingest Enabled
          type: boolean
        last_latency_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Last Latency Ms
        last_tick_ts:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Tick Ts
        provider_id:
          title: Provider Id
          type: string
        simulated:
          title: Simulated
          type: boolean
        ticks_total:
          title: Ticks Total
          type: integer
      required:
      - simulated
      - provider_id
      - ingest_enabled
      - ticks_total
      - candles_total
      - gaps_total
      - as_of
      title: FeedStatusOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthOut:
      properties:
        service:
          title: Service
          type: string
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
        version:
          title: Version
          type: string
      required:
      - service
      - status
      - version
      title: HealthOut
      type: object
    InstrumentDetailOut:
      description: Specs mínimos + parámetros complementarios (Q §2.8 `GET /instruments/{symbol}`).
      properties:
        asset_class:
          enum:
          - forex
          - crypto
          title: Asset Class
          type: string
        base_currency:
          title: Base Currency
          type: string
        contract_size:
          title: Contract Size
          type: string
        display_name:
          title: Display Name
          type: string
        market:
          $ref: '#/components/schemas/MarketStateOut'
        max_volume:
          title: Max Volume
          type: string
        min_volume:
          title: Min Volume
          type: string
        pip_size:
          title: Pip Size
          type: string
        price_precision:
          title: Price Precision
          type: integer
        quote_currency:
          title: Quote Currency
          type: string
        status:
          enum:
          - active
          - paused
          - delisted
          title: Status
          type: string
        symbol:
          title: Symbol
          type: string
        tick_size:
          title: Tick Size
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        version:
          title: Version
          type: integer
        volume_step:
          title: Volume Step
          type: string
      required:
      - symbol
      - display_name
      - asset_class
      - base_currency
      - quote_currency
      - status
      - tick_size
      - min_volume
      - max_volume
      - volume_step
      - version
      - valid_from
      - pip_size
      - contract_size
      - price_precision
      - market
      title: InstrumentDetailOut
      type: object
    InstrumentOut:
      description: Specs mínimos del instrumento (Q §2.8 `GET /instruments`).
      properties:
        asset_class:
          enum:
          - forex
          - crypto
          title: Asset Class
          type: string
        base_currency:
          title: Base Currency
          type: string
        display_name:
          title: Display Name
          type: string
        max_volume:
          title: Max Volume
          type: string
        min_volume:
          title: Min Volume
          type: string
        quote_currency:
          title: Quote Currency
          type: string
        status:
          enum:
          - active
          - paused
          - delisted
          title: Status
          type: string
        symbol:
          title: Symbol
          type: string
        tick_size:
          title: Tick Size
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        version:
          title: Version
          type: integer
        volume_step:
          title: Volume Step
          type: string
      required:
      - symbol
      - display_name
      - asset_class
      - base_currency
      - quote_currency
      - status
      - tick_size
      - min_volume
      - max_volume
      - volume_step
      - version
      - valid_from
      title: InstrumentOut
      type: object
    InstrumentPageOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/InstrumentOut'
          title: Data
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - data
      - page
      title: InstrumentPageOut
      type: object
    InstrumentSpecOut:
      description: Spec completa vigente con sesiones y estado (Q §2.8 `GET .../specs`,
        K §2).
      properties:
        asset_class:
          enum:
          - forex
          - crypto
          title: Asset Class
          type: string
        contract_size:
          title: Contract Size
          type: string
        display_name:
          title: Display Name
          type: string
        fee_schedule:
          additionalProperties:
            type: string
          title: Fee Schedule
          type: object
        jurisdiction_restrictions:
          items:
            type: string
          title: Jurisdiction Restrictions
          type: array
        margin_requirements:
          additionalProperties:
            type: string
          title: Margin Requirements
          type: object
        market:
          $ref: '#/components/schemas/MarketStateOut'
        max_volume:
          title: Max Volume
          type: string
        min_volume:
          title: Min Volume
          type: string
        pip_size:
          title: Pip Size
          type: string
        price_precision:
          title: Price Precision
          type: integer
        sessions:
          items:
            $ref: '#/components/schemas/TradingSessionOut'
          title: Sessions
          type: array
        status:
          enum:
          - active
          - paused
          - delisted
          title: Status
          type: string
        swap_configuration:
          additionalProperties:
            anyOf:
            - type: string
            - type: boolean
          title: Swap Configuration
          type: object
        symbol:
          title: Symbol
          type: string
        tick_size:
          title: Tick Size
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        valid_to:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Valid To
        version:
          title: Version
          type: integer
        volume_step:
          title: Volume Step
          type: string
      required:
      - symbol
      - display_name
      - asset_class
      - status
      - version
      - valid_from
      - tick_size
      - pip_size
      - contract_size
      - min_volume
      - max_volume
      - volume_step
      - price_precision
      - margin_requirements
      - fee_schedule
      - swap_configuration
      - jurisdiction_restrictions
      - sessions
      - market
      title: InstrumentSpecOut
      type: object
    MarketClassOverview:
      properties:
        asset_class:
          enum:
          - forex
          - crypto
          title: Asset Class
          type: string
        instruments:
          items:
            $ref: '#/components/schemas/OverviewQuote'
          title: Instruments
          type: array
        status:
          enum:
          - available
          - stale
          - unavailable
          title: Status
          type: string
      required:
      - asset_class
      - status
      - instruments
      title: MarketClassOverview
      type: object
    MarketOverview:
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: UTC; obtención del snapshot más reciente o null
          title: As Of
        classes:
          items:
            $ref: '#/components/schemas/MarketClassOverview'
          title: Classes
          type: array
      required:
      - classes
      title: MarketOverview
      type: object
    MarketStateOut:
      description: Estado de mercado del símbolo (REQ-099, K §2).
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        next_close:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Next Close
        next_open:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Next Open
        reason:
          title: Reason
          type: string
        status:
          enum:
          - open
          - closed
          - halted
          title: Status
          type: string
      required:
      - status
      - reason
      - as_of
      title: MarketStateOut
      type: object
    OverviewQuote:
      properties:
        attribution:
          anyOf:
          - type: string
          - type: 'null'
          description: Texto de atribución exigido por el proveedor
          title: Attribution
        provider:
          description: Id del proveedor keyless que sirvió el snapshot
          title: Provider
          type: string
        simulated:
          const: false
          default: false
          description: 'siempre false: G3 (X-07) está bloqueado'
          title: Simulated
          type: boolean
        source:
          description: Fuente del dato, p. ej. 'Banco Central Europeo (ECB) vía Frankfurter'
          title: Source
          type: string
        stale:
          default: false
          description: true = último dato bueno, más antiguo que el TTL
          title: Stale
          type: boolean
        symbol:
          description: Par normalizado, p. ej. EUR/USD o BTC/USD
          title: Symbol
          type: string
        ts:
          description: UTC; en forex es la fecha de referencia diaria (00:00Z), en
            crypto el instante de consulta
          format: date-time
          title: Ts
          type: string
        value:
          description: Último valor de referencia conocido (> 0)
          exclusiveMinimum: 0.0
          title: Value
          type: number
      required:
      - symbol
      - value
      - ts
      - source
      - provider
      title: OverviewQuote
      type: object
    PageInfo:
      description: 'Q-api-map §1.4: cursor opaco, sin offset.'
      properties:
        has_more:
          default: false
          title: Has More
          type: boolean
        limit:
          default: 25
          title: Limit
          type: integer
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        prev_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev Cursor
      title: PageInfo
      type: object
    SymbolListOut:
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        data:
          items:
            $ref: '#/components/schemas/SymbolOut'
          title: Data
          type: array
        simulated:
          title: Simulated
          type: boolean
      required:
      - data
      - simulated
      - as_of
      title: SymbolListOut
      type: object
    SymbolOut:
      properties:
        asset_class:
          enum:
          - forex
          - crypto
          title: Asset Class
          type: string
        base_currency:
          title: Base Currency
          type: string
        display_name:
          title: Display Name
          type: string
        feed:
          $ref: '#/components/schemas/FeedBriefOut'
        market:
          $ref: '#/components/schemas/MarketStateOut'
        quote_currency:
          title: Quote Currency
          type: string
        status:
          enum:
          - active
          - paused
          - delisted
          title: Status
          type: string
        symbol:
          title: Symbol
          type: string
      required:
      - symbol
      - display_name
      - asset_class
      - base_currency
      - quote_currency
      - status
      - market
      - feed
      title: SymbolOut
      type: object
    TickOut:
      properties:
        price:
          title: Price
          type: string
        side:
          enum:
          - buy
          - sell
          - na
          title: Side
          type: string
        simulated:
          title: Simulated
          type: boolean
        size:
          anyOf:
          - type: string
          - type: 'null'
          title: Size
        source:
          title: Source
          type: string
        symbol:
          title: Symbol
          type: string
        tick_id:
          format: uuid
          title: Tick Id
          type: string
        ts:
          format: date-time
          title: Ts
          type: string
      required:
      - tick_id
      - symbol
      - price
      - side
      - ts
      - source
      - simulated
      title: TickOut
      type: object
    TickPageOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TickOut'
          title: Data
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - data
      - page
      title: TickPageOut
      type: object
    TradingSessionOut:
      properties:
        close_utc:
          format: time
          title: Close Utc
          type: string
        holiday_calendar:
          anyOf:
          - type: string
          - type: 'null'
          title: Holiday Calendar
        open_utc:
          format: time
          title: Open Utc
          type: string
        session_type:
          enum:
          - regular
          - pre
          - post
          title: Session Type
          type: string
        timezone:
          title: Timezone
          type: string
        weekday:
          description: 'ISO weekday: lunes=0 … domingo=6'
          maximum: 6.0
          minimum: 0.0
          title: Weekday
          type: integer
      required:
      - weekday
      - open_utc
      - close_utc
      - timezone
      - session_type
      title: TradingSessionOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: MonedasAR Market Data Service
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/instruments:
    get:
      description: Catálogo de instrumentos con cursor y filtros por tipo/estado (Q
        §2.8, §1.4).
      operationId: instruments_api_v1_instruments_get
      parameters:
      - description: Filtrar por clase de activo
        in: query
        name: asset_class
        required: false
        schema:
          anyOf:
          - enum:
            - forex
            - crypto
            type: string
          - type: 'null'
          description: Filtrar por clase de activo
          title: Asset Class
      - description: Filtrar por estado comercial
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - paused
            - delisted
            type: string
          - type: 'null'
          description: Filtrar por estado comercial
          title: Status
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentPageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Instruments
      tags:
      - instruments
  /api/v1/instruments/{symbol}:
    get:
      description: Specs mínimos del instrumento + estado de mercado (Q §2.8).
      operationId: instrument_detail_api_v1_instruments__symbol__get
      parameters:
      - in: path
        name: symbol
        required: true
        schema:
          title: Symbol
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentDetailOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Instrument Detail
      tags:
      - instruments
  /api/v1/instruments/{symbol}/specs:
    get:
      description: Spec vigente completa con sesiones y estado de mercado (Q §2.8,
        K §2).
      operationId: instrument_specs_api_v1_instruments__symbol__specs_get
      parameters:
      - in: path
        name: symbol
        required: true
        schema:
          title: Symbol
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentSpecOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Instrument Specs
      tags:
      - instruments
  /api/v1/market-data/candles/{symbol}/{timeframe}:
    get:
      description: Velas OHLC (cursor + `from`/`to`; huecos `gap=true` incluidos,
        K §4.4(c)).
      operationId: candles_api_v1_market_data_candles__symbol___timeframe__get
      parameters:
      - in: path
        name: symbol
        required: true
        schema:
          title: Symbol
          type: string
      - in: path
        name: timeframe
        required: true
        schema:
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
          - 4h
          - 1d
          title: Timeframe
          type: string
      - in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: From
      - in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: To
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlePageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Candles
      tags:
      - market-data
  /api/v1/market-data/overview:
    get:
      operationId: overview_api_v1_market_data_overview_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverview'
          description: Successful Response
      summary: Overview
      tags:
      - market-data
  /api/v1/market-data/status:
    get:
      description: 'Estado del feed: simulated/real, latencia y huecos detectados
        (Q §2.7).'
      operationId: status_api_v1_market_data_status_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStatusOut'
          description: Successful Response
      summary: Status
      tags:
      - market-data
  /api/v1/market-data/symbols:
    get:
      description: Símbolos con sesión de mercado y estado del feed (Q §2.7, pública).
      operationId: market_symbols_api_v1_market_data_symbols_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolListOut'
          description: Successful Response
      summary: Market Symbols
      tags:
      - market-data
  /api/v1/market-data/ticks:
    get:
      description: Histórico de ticks (cursor, rango ≤ 24 h — Q §2.7/§5).
      operationId: ticks_history_api_v1_market_data_ticks_get
      parameters:
      - description: Símbolo canónico (EUR/USD)
        in: query
        name: symbol
        required: true
        schema:
          description: Símbolo canónico (EUR/USD)
          maxLength: 32
          minLength: 1
          title: Symbol
          type: string
      - in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: From
      - in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: To
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickPageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ticks History
      tags:
      - market-data
  /api/v1/market-data/ticks/{symbol}:
    get:
      operationId: latest_tick_api_v1_market_data_ticks__symbol__get
      parameters:
      - in: path
        name: symbol
        required: true
        schema:
          title: Symbol
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Latest Tick
      tags:
      - market-data
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
