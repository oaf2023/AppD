components:
  schemas:
    HealthOut:
      properties:
        service:
          title: Service
          type: string
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
        version:
          title: Version
          type: string
      required:
      - service
      - status
      - version
      title: HealthOut
      type: object
    MarketClassOverview:
      properties:
        asset_class:
          enum:
          - forex
          - crypto
          title: Asset Class
          type: string
        instruments:
          items:
            $ref: '#/components/schemas/OverviewQuote'
          title: Instruments
          type: array
        status:
          enum:
          - available
          - stale
          - unavailable
          title: Status
          type: string
      required:
      - asset_class
      - status
      - instruments
      title: MarketClassOverview
      type: object
    MarketOverview:
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: UTC; obtención del snapshot más reciente o null
          title: As Of
        classes:
          items:
            $ref: '#/components/schemas/MarketClassOverview'
          title: Classes
          type: array
      required:
      - classes
      title: MarketOverview
      type: object
    OverviewQuote:
      properties:
        attribution:
          anyOf:
          - type: string
          - type: 'null'
          description: Texto de atribución exigido por el proveedor
          title: Attribution
        provider:
          description: Id del proveedor keyless que sirvió el snapshot
          title: Provider
          type: string
        simulated:
          const: false
          default: false
          description: 'siempre false: G3 (X-07) está bloqueado'
          title: Simulated
          type: boolean
        source:
          description: Fuente del dato, p. ej. 'Banco Central Europeo (ECB) vía Frankfurter'
          title: Source
          type: string
        stale:
          default: false
          description: true = último dato bueno, más antiguo que el TTL
          title: Stale
          type: boolean
        symbol:
          description: Par normalizado, p. ej. EUR/USD o BTC/USD
          title: Symbol
          type: string
        ts:
          description: UTC; en forex es la fecha de referencia diaria (00:00Z), en
            crypto el instante de consulta
          format: date-time
          title: Ts
          type: string
        value:
          description: Último valor de referencia conocido (> 0)
          exclusiveMinimum: 0.0
          title: Value
          type: number
      required:
      - symbol
      - value
      - ts
      - source
      - provider
      title: OverviewQuote
      type: object
info:
  title: MonedasAR Market Data Service
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/market-data/overview:
    get:
      operationId: overview_api_v1_market_data_overview_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverview'
          description: Successful Response
      summary: Overview
      tags:
      - market-data
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: Successful Response
      summary: Readyz
      tags:
      - system
