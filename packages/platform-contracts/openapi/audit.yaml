components:
  schemas:
    AuditBatchIn:
      properties:
        records:
          items:
            $ref: '#/components/schemas/AuditRecordIn'
          maxItems: 200
          minItems: 1
          title: Records
          type: array
      required:
      - records
      title: AuditBatchIn
      type: object
    AuditBatchOut:
      properties:
        accepted:
          title: Accepted
          type: integer
        duplicates:
          title: Duplicates
          type: integer
      required:
      - accepted
      - duplicates
      title: AuditBatchOut
      type: object
    AuditPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditRecordOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      title: AuditPage
      type: object
    AuditRecordIn:
      properties:
        action:
          title: Action
          type: string
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        actor_type:
          default: system
          title: Actor Type
          type: string
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        aggregate_id:
          title: Aggregate Id
          type: string
        aggregate_type:
          title: Aggregate Type
          type: string
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        causation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Causation Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        event_id:
          title: Event Id
          type: string
        event_type:
          title: Event Type
          type: string
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        payload:
          additionalProperties: true
          title: Payload
          type: object
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        recorded_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Recorded At
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        schema_version:
          default: 1
          title: Schema Version
          type: integer
        severity:
          default: INFO
          title: Severity
          type: string
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
      required:
      - event_id
      - event_type
      - aggregate_type
      - aggregate_id
      - action
      title: AuditRecordIn
      type: object
    AuditRecordOut:
      properties:
        action:
          title: Action
          type: string
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        actor_type:
          title: Actor Type
          type: string
        aggregate_id:
          title: Aggregate Id
          type: string
        aggregate_type:
          title: Aggregate Type
          type: string
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        event_id:
          title: Event Id
          type: string
        event_type:
          title: Event Type
          type: string
        recorded_at:
          format: date-time
          title: Recorded At
          type: string
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        severity:
          title: Severity
          type: string
      required:
      - event_id
      - event_type
      - action
      - aggregate_type
      - aggregate_id
      - actor_type
      - actor_id
      - resource_type
      - resource_id
      - severity
      - correlation_id
      - request_id
      - recorded_at
      title: AuditRecordOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: '[PROJECT_NAME] Audit Service'
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/audit-events:
    get:
      operationId: list_records_api_v1_audit_events_get
      parameters:
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - in: query
        name: event_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      - in: query
        name: aggregate_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Aggregate Id
      - in: query
        name: severity
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - in: query
        name: date_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Date From
      - in: query
        name: date_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Date To
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Records
      tags:
      - audit
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /internal/v1/audit-events:
    post:
      description: Ingesta idempotente por `event_id` (solo servicios autenticados).
      operationId: ingest_internal_v1_audit_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditBatchIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditBatchOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ingest
      tags:
      - internal
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Readyz Readyz Get
                type: object
          description: Successful Response
      summary: Readyz
      tags:
      - system
