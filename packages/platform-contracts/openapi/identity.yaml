components:
  schemas:
    ForgotPasswordIn:
      properties:
        email:
          format: email
          title: Email
          type: string
      required:
      - email
      title: ForgotPasswordIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthOut:
      properties:
        service:
          title: Service
          type: string
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
        version:
          title: Version
          type: string
      required:
      - service
      - status
      - version
      title: HealthOut
      type: object
    LoginIn:
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          maxLength: 256
          minLength: 1
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginIn
      type: object
    LogoutIn:
      properties:
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
      title: LogoutIn
      type: object
    MessageOut:
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
      title: MessageOut
      type: object
    MfaLoginIn:
      properties:
        code:
          maxLength: 8
          minLength: 6
          title: Code
          type: string
        mfa_token:
          title: Mfa Token
          type: string
      required:
      - mfa_token
      - code
      title: MfaLoginIn
      type: object
    MfaRequiredOut:
      properties:
        mfa_required:
          default: true
          title: Mfa Required
          type: boolean
        mfa_token:
          title: Mfa Token
          type: string
      required:
      - mfa_token
      title: MfaRequiredOut
      type: object
    MfaSetupOut:
      properties:
        otpauth_url:
          title: Otpauth Url
          type: string
        secret:
          title: Secret
          type: string
      required:
      - secret
      - otpauth_url
      title: MfaSetupOut
      type: object
    MfaVerifyIn:
      properties:
        code:
          maxLength: 8
          minLength: 6
          title: Code
          type: string
      required:
      - code
      title: MfaVerifyIn
      type: object
    RefreshIn:
      properties:
        refresh_token:
          maxLength: 128
          minLength: 32
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshIn
      type: object
    RegisterIn:
      properties:
        accept_terms:
          default: false
          title: Accept Terms
          type: boolean
        email:
          format: email
          title: Email
          type: string
        jurisdiction:
          anyOf:
          - maxLength: 8
            type: string
          - type: 'null'
          title: Jurisdiction
        password:
          maxLength: 256
          minLength: 12
          title: Password
          type: string
      required:
      - email
      - password
      title: RegisterIn
      type: object
    RegisterOut:
      properties:
        dev_verification_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Dev Verification Token
        email:
          title: Email
          type: string
        email_verification_required:
          title: Email Verification Required
          type: boolean
        status:
          title: Status
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - user_id
      - email
      - status
      - email_verification_required
      title: RegisterOut
      type: object
    ResetPasswordIn:
      properties:
        new_password:
          maxLength: 256
          minLength: 12
          title: New Password
          type: string
        token:
          maxLength: 128
          minLength: 32
          title: Token
          type: string
      required:
      - token
      - new_password
      title: ResetPasswordIn
      type: object
    SessionOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        last_seen_at:
          format: date-time
          title: Last Seen At
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
      required:
      - id
      - created_at
      - expires_at
      - revoked_at
      - ip
      - user_agent
      - last_seen_at
      title: SessionOut
      type: object
    TokenPairOut:
      properties:
        access_token:
          title: Access Token
          type: string
        expires_in:
          title: Expires In
          type: integer
        refresh_token:
          title: Refresh Token
          type: string
        session_id:
          format: uuid
          title: Session Id
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/UserOut'
      required:
      - access_token
      - refresh_token
      - expires_in
      - session_id
      - user
      title: TokenPairOut
      type: object
    UserInternalOut:
      description: Perfil mínimo para otros servicios (Q-api-map §3, minimización
        de PII).
      properties:
        email_verified:
          title: Email Verified
          type: boolean
        jurisdiction:
          title: Jurisdiction
          type: string
        status:
          title: Status
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - user_id
      - status
      - jurisdiction
      - email_verified
      title: UserInternalOut
      type: object
    UserOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        email_verified:
          title: Email Verified
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        mfa_enabled:
          title: Mfa Enabled
          type: boolean
        roles:
          items:
            type: string
          title: Roles
          type: array
        status:
          title: Status
          type: string
      required:
      - id
      - email
      - status
      - roles
      - email_verified
      - mfa_enabled
      - created_at
      title: UserOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerifyEmailIn:
      properties:
        token:
          maxLength: 128
          minLength: 32
          title: Token
          type: string
      required:
      - token
      title: VerifyEmailIn
      type: object
info:
  title: MonedasAR Identity Service
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/users:
    get:
      operationId: admin_list_users_api_v1_admin_users_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                title: Response Admin List Users Api V1 Admin Users Get
                type: array
          description: Successful Response
      summary: Admin List Users
      tags:
      - admin
  /api/v1/auth/login:
    post:
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairOut'
                - $ref: '#/components/schemas/MfaRequiredOut'
                title: Response Login Api V1 Auth Login Post
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout
      tags:
      - auth
  /api/v1/auth/mfa:
    delete:
      operationId: mfa_disable_api_v1_auth_mfa_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mfa Disable
      tags:
      - mfa
  /api/v1/auth/mfa/login:
    post:
      operationId: mfa_login_api_v1_auth_mfa_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mfa Login
      tags:
      - auth
  /api/v1/auth/mfa/setup:
    post:
      operationId: mfa_setup_api_v1_auth_mfa_setup_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupOut'
          description: Successful Response
      summary: Mfa Setup
      tags:
      - mfa
  /api/v1/auth/mfa/verify:
    post:
      operationId: mfa_verify_api_v1_auth_mfa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mfa Verify
      tags:
      - mfa
  /api/v1/auth/password/forgot:
    post:
      operationId: forgot_password_api_v1_auth_password_forgot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordIn'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Forgot Password
      tags:
      - auth
  /api/v1/auth/password/reset:
    post:
      operationId: reset_password_api_v1_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reset Password
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Refresh
      tags:
      - auth
  /api/v1/auth/register:
    post:
      operationId: register_api_v1_auth_register_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register
      tags:
      - auth
  /api/v1/auth/sessions:
    get:
      operationId: list_sessions_api_v1_auth_sessions_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionOut'
                title: Response List Sessions Api V1 Auth Sessions Get
                type: array
          description: Successful Response
      summary: List Sessions
      tags:
      - account
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: revoke_session_api_v1_auth_sessions__session_id__delete
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revoke Session
      tags:
      - account
  /api/v1/auth/verify-email:
    post:
      operationId: verify_email_api_v1_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Verify Email
      tags:
      - auth
  /api/v1/me:
    get:
      operationId: me_api_v1_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
          description: Successful Response
      summary: Me
      tags:
      - account
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /internal/v1/users/{user_id}:
    get:
      description: Solo JWT de servicio (accounts/kyc/admin); 404 si el usuario no
        existe.
      operationId: get_user_internal_internal_v1_users__user_id__get
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          title: User Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInternalOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Perfil mínimo para servicios internos (Q-api-map §3)
      tags:
      - internal
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Readyz Readyz Get
                type: object
          description: Successful Response
      summary: Readyz
      tags:
      - system
