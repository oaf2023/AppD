components:
  schemas:
    EntryIn:
      additionalProperties: false
      description: Asiento individual de un posting.
      properties:
        account_code:
          examples:
          - 2000.PAYABLE.CLIENT.USD.u1
          maxLength: 64
          minLength: 6
          title: Account Code
          type: string
        amount:
          description: Importe decimal en cadena; nunca un número JSON (ADR-0006)
          title: Amount
          type: string
        currency:
          examples:
          - USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          title: Currency
          type: string
        direction:
          description: D o C (también debit/credit, insensible a mayúsculas). Se normaliza
            a D|C.
          examples:
          - D
          maxLength: 8
          minLength: 1
          title: Direction
          type: string
        owner_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Obligatorio en cuentas no control (L §7.1)
          title: Owner Id
        owner_type:
          anyOf:
          - enum:
            - user
            - tenant
            type: string
          - type: 'null'
          title: Owner Type
        reverses_entry_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Reversión granular (L §3)
          title: Reverses Entry Id
      required:
      - account_code
      - direction
      - amount
      - currency
      title: EntryIn
      type: object
    EntryOut:
      description: Asiento persistido.
      properties:
        account_code:
          title: Account Code
          type: string
        account_id:
          format: uuid
          title: Account Id
          type: string
        amount:
          title: Amount
          type: string
        currency:
          title: Currency
          type: string
        direction:
          enum:
          - D
          - C
          title: Direction
          type: string
        entry_id:
          format: uuid
          title: Entry Id
          type: string
        position:
          title: Position
          type: integer
        reverses_entry_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reverses Entry Id
      required:
      - entry_id
      - position
      - account_id
      - account_code
      - direction
      - amount
      - currency
      title: EntryOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthOut:
      properties:
        service:
          title: Service
          type: string
        status:
          title: Status
          type: string
      required:
      - service
      - status
      title: HealthOut
      type: object
    PostingOut:
      description: Transacción ledger con sus asientos (respuesta de creación y de
        replay).
      properties:
        causation_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Causation Id
        correlation_id:
          format: uuid
          title: Correlation Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        entries:
          items:
            $ref: '#/components/schemas/EntryOut'
          title: Entries
          type: array
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        reverses_tx_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reverses Tx Id
        transaction_id:
          format: uuid
          title: Transaction Id
          type: string
        type:
          enum:
          - deposit
          - withdrawal
          - transfer
          - conversion
          - fee
          - swap
          - pnl
          - margin_funding
          - reversal
          - adjustment
          title: Type
          type: string
      required:
      - transaction_id
      - type
      - correlation_id
      - occurred_at
      - entries
      - created_at
      title: PostingOut
      type: object
    PostingsIn:
      additionalProperties: false
      description: 'Comando de escritura: única vía de creación de asientos (Q-api-map
        §3).'
      properties:
        causation_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Causation Id
        correlation_id:
          format: uuid
          title: Correlation Id
          type: string
        entries:
          items:
            $ref: '#/components/schemas/EntryIn'
          maxItems: 1000
          minItems: 2
          title: Entries
          type: array
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        reverses_tx_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reverses Tx Id
        type:
          enum:
          - deposit
          - withdrawal
          - transfer
          - conversion
          - fee
          - swap
          - pnl
          - margin_funding
          - reversal
          - adjustment
          title: Type
          type: string
      required:
      - type
      - correlation_id
      - occurred_at
      - entries
      title: PostingsIn
      type: object
    ReadyOut:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: ReadyOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: MonedasAR Ledger Service
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /internal/v1/postings:
    post:
      description: 'Crea una transacción ledger con sus asientos y su evento `LedgerPosted`.


        Requiere token de servicio y la cabecera `Idempotency-Key` (ausente o no

        UUID → `400` de validación, ADR-0010 §1). El replay devuelve la misma

        respuesta con `Idempotent-Replay: true`.'
      operationId: create_posting_internal_v1_postings_post
      parameters:
      - description: 'Obligatorio: UUID único por operación lógica (ADR-0010).'
        in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Obligatorio: UUID único por operación lógica (ADR-0010).'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingsIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Registra un posting double-entry (única vía de escritura del ledger)
      tags:
      - internal
  /internal/v1/postings/{posting_id}:
    get:
      operationId: read_posting_internal_v1_postings__posting_id__get
      parameters:
      - in: path
        name: posting_id
        required: true
        schema:
          format: uuid
          title: Posting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Recupera un posting por su identificador
      tags:
      - internal
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyOut'
          description: Successful Response
      summary: Readyz
      tags:
      - system
