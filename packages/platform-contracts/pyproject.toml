[project]
name = "platform-contracts"
version = "0.1.0"
description = "Contratos compartidos: eventos, roles, cabeceras internas, esquemas de auditoría"
requires-python = ">=3.13"
dependencies = [
    "platform-kernel",
    "pydantic>=2.10.0",
]

[tool.uv.sources]
platform-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_contracts"]
