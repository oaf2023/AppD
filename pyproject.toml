[project]
name = "platform"
version = "0.1.0"
description = "[PROJECT_NAME] — raíz del workspace Python del monorepo"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "fakeredis>=2.26.0",
    "aiosqlite>=0.20.0",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
exclude = "(migrations/|tests/|.venv/|node_modules/)"

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "fakeredis.*", "prometheus_client.*", "argon2.*", "jwt.*", "alembic.*", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: pruebas que requieren PostgreSQL o servicios externos",
    "e2e: pruebas de extremo a extremo a través del gateway",
]

[tool.coverage.run]
source = ["packages", "services"]
omit = ["*/migrations/*", "*/tests/*"]
